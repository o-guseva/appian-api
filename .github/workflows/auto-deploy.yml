name: DEPLOY APPIAN PACKAGES

on: 
  workflow_dispatch:

  push:
    branches:
      - test
      - main
      
jobs:
  deploy-appian:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code 
        uses: actions/checkout@v4 
      - name: Set Environment Variables 
        run: |
          if [ "${GITHUB_REF_NAME}" = "test" ]; then
            echo "APP_URL=${{ secrets.TEST_APP_URL }}" >> $GITHUB_ENV
            echo "APPIAN_API_KEY=${{ secrets.TEST_APPIAN_API_KEY }}" >> $GITHUB_ENV 
            echo "DB_HOST=${{ secrets.TEST_DB_HOST }}" >> $GITHUB_ENV
            echo "DB_NAME=${{ secrets.TEST_DB_NAME }}" >> $GITHUB_ENV 
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> $GITHUB_ENV
            echo "DB_USER=${{ secrets.TEST_DB_USER }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.TEST_DB_PASSWORD }}" >> $GITHUB_ENV
            
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "APP_URL=${{ secrets.PROD_APP_URL }}" >> $GITHUB_ENV
            echo "APPIAN_API_KEY=${{ secrets.PROD_APPIAN_API_KEY }}" >> $GITHUB_ENV
            echo "DB_HOST=${{ secrets.PROD_DB_HOST }}" >> $GITHUB_ENV
            echo "DB_NAME=${{ secrets.PROD_DB_NAME }}" >> $GITHUB_ENV 
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> $GITHUB_ENV
            echo "DB_USER=${{ secrets.PROD_DB_USER }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Unsupported branch"
            exit 1
          fi 
      - name: Show Deployment Target
        run: |
          echo "================================================="
          echo "Branch: $GITHUB_REF_NAME"
          echo "APP_URL=$APP_URL"

          if [ "$GITHUB_REF_NAME" = "test" ]; then
            echo "Deploying to CALI DEV"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "Deploying to CALI PROD"
          fi
          echo "================================================="          
          
      - name: RUN DIFF - COMPARE CHANGES AND BUILD PACKAGE
        shell: bash
        run: |
          echo "================================"
          echo "Comparing current commit with previous...."
          echo "================================"

          git diff --name-status HEAD~1 HEAD > diff-report.txt || true
          echo ""
          echo "Changed files:"
          cat diff-report.txt
          echo ""
          echo "Added:"
          grep "^A" diff-report.txt || true
          echo ""
          echo "Modified:"
          grep "^M" diff-report.txt || true
          echo ""
          echo "Deleted:"
          grep "^D" diff-report.txt || true
          echo ""
          echo "Creating Deployment Package"
          zip -r appian-package.zip \
            application \
            content \
            datatype \
            group \
            groupType \
            META-INF \
            processModel \
            processModelFolder \
            recordType \
            patches \
            -x ".git/*" \
               ".github/*" \
               "README.md"
               
          echo "========= ZIP CHECK ============="
          pwd
          ls -lah
          find . -name "appian-package.zip"

          if [ -f appian-package.zip ]; then
            echo "ZIP EXISTS"
            ls -lh appian-package.zip
          else
            echo "ZIP NOT FOUND"
            exit 1
          fi
          echo "PACKAGE_FILE=appian-package.zip" >> $GITHUB_ENV
  
          PROPERTIES_FILES=$(find . -maxdepth 1 -name "*.properties" | head -n 1 | sed 's|^\./||')
          SQL_FILE=$(find . -maxdepth 1 -name "*.sql" | head -n 1 | sed 's|^\./||')
          echo "PROPERTIES_FILES=$PROPERTIES_FILES" >> $GITHUB_ENV
          echo "SQL_FILE=$SQL_FILE" >> $GITHUB_ENV
          echo "Selected properties file: $PROPERTIES_FILES"
          echo "Selected SQL file: $SQL_FILE"
          echo "ALL PROPERTIES FILES:"
          find . -maxdepth 1 -name "*.properties"
          echo "ALL SQL FILES:"
          find . -maxdepth 1 -name "*.sql"
          echo ""
          echo "Package Created:"
          ls -lh appian-package.zip
          
      - name: Upload Deployment Package
        env:
          PACKAGE_FILE: ${{ env.PACKAGE_FILE }}
          PROPERTIES_FILES: ${{ env.PROPERTIES_FILES }}
          SQL_FILE: ${{ env.SQL_FILE }}
          
        run: |
        
          echo "PACKAGE_FILE=$PACKAGE_FILE" 
          echo "PROPERTIES_FILES=$PROPERTIES_FILES" 
          echo "SQL_FILE=$SQL_FILE"

          if [ ! -f "$PACKAGE_FILE" ]; then
            echo "Package file not found: $PACKAGE_FILE"
            exit 1
          fi

          JSON_BODY=$(cat <<EOF
          {
            "name":"GitHub Deployment",
            "packageFileName":"$PACKAGE_FILE",
            "customizationFileName":"$PROPERTIES_FILES",
            "dataSource":"jdbc/Appian",
            "databaseScripts":[
              {
                "fileName":"$SQL_FILE",
                "orderId":1
              }
             ]
            }
          EOF
          )
          echo "============= JSON BODY =================="
          echo "$JSON_BODY"
          
          RESPONSE=$(curl -s -X POST "$APP_URL/suite/deployment-management/v2/deployments" \
            -H "Appian-API-Key: $APPIAN_API_KEY" \
            -F "json=$JSON_BODY;type=application/json" \
            -F "file=@$PACKAGE_FILE" \
            -F "file=@$PROPERTIES_FILES" \
            -F "file=@$SQL_FILE"
            )
                                  
          echo "UPLOAD RESPONSE:"
          echo "$RESPONSE"
