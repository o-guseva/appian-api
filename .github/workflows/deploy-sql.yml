name: Deploy SQL to CALI DEV

on:
  workflow_dispatch:

jobs:
  deploy-sql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Verify Files
        run: ls -la

      - name: Install MySQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
      - name: Execute SQL Script
        run: |
          mysql \ 
            -h ${{ secrets.DB_HOST }} \
            -P ${{ secrets.DB_PORT }} \
            -u ${{ secrets.DB_USER }} \
            -p${{ secrets.DB_PASSWORD }} \
            ${{ secrets.DB_NAME }}
            < IEM_ICO_Primary.sql
