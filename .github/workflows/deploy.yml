name: Deploy to CALI DEV 

on:
  workflow_dispatch: 

    
jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
    - name: Debug file
      run: ls -la

    - name: Verify package exists
      run: |
        ls -la
        
    - name: Debug API key length
      env:
        APPIAN_API_KEY: ${{ secrets.APPIAN_API_KEY }}
      run: |
        echo "API KEY LENGTH=${#APPIAN_API_KEY}"
        
    - name: Upload file to CALI-DEV
      id: token
      run: |
        RESPONSE=$(curl -v -X POST "${{ secrets.APP_URL }}/suite/deployment-management/v2/deployments" \
          -H "Appian-API-Key: ${{  secrets.APPIAN_API_KEY }}" \
          -F 'json={"name":"Test Deployment PART 2","packageFileName":"IEM_ICO_Primary.sql"};type=application/json' \
          -F "file=@IEM_ICO_Primary.sql")


        echo "UPLOAD RESPONSE:"
        echo "$RESPONSE"
      



